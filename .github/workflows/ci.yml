name: Backend checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: PHP ${{ matrix.php }} / Apache / MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build isolated test environment
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t bf2stats-test -f tests/Containerfile tests
      - name: PHP lint, database regressions and Apache integration
        run: docker run --rm --network=none -v "$GITHUB_WORKSPACE:/workspace:ro" bf2stats-test bash tests/container-run.sh
      - name: Verify release packaging
        run: python3 -m unittest discover -s tests -p 'test_*.py'
